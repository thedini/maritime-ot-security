<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Helvetica,Arial,sans-serif">
<rect width="1200" height="780" fill="#ffffff"/>
<text x="600" y="56" text-anchor="middle" font-size="36" font-weight="700" fill="#002B5C">CAN Physical Layer — Differential Signaling</text>
<!-- bus topology -->
<line x1="200" y1="190" x2="1000" y2="190" stroke="#002B5C" stroke-width="4"/>
<line x1="200" y1="250" x2="1000" y2="250" stroke="#3F88C5" stroke-width="4"/>
<text x="112" y="196" font-size="20" font-weight="700" fill="#002B5C">CAN_H</text>
<text x="112" y="256" font-size="20" font-weight="700" fill="#3F88C5">CAN_L</text>
<!-- terminations -->
<path d="M200,190 v15 l12,6 l-24,12 l24,12 l-24,12 l12,6 v-3" fill="none" stroke="#11202b" stroke-width="2"/>
<line x1="200" y1="250" x2="200" y2="250" stroke="#11202b"/>
<rect x="186" y="205" width="28" height="40" fill="none" stroke="#11202b" stroke-width="2"/>
<text x="160" y="300" font-size="17" fill="#11202b">120Ω</text>
<rect x="986" y="205" width="28" height="40" fill="none" stroke="#11202b" stroke-width="2"/>
<text x="1000" y="300" font-size="17" fill="#11202b">120Ω</text>
<!-- nodes -->
<g font-size="18" fill="#fff" text-anchor="middle">
<rect x="360" y="110" width="120" height="46" rx="8" fill="#002B5C"/><text x="420" y="139">Node</text>
<rect x="540" y="110" width="120" height="46" rx="8" fill="#002B5C"/><text x="600" y="139">Node</text>
<rect x="720" y="110" width="120" height="46" rx="8" fill="#002B5C"/><text x="780" y="139">Node</text>
</g>
<g stroke="#888" stroke-width="2">
<line x1="408" y1="156" x2="408" y2="190"/><line x1="432" y1="156" x2="432" y2="250"/>
<line x1="588" y1="156" x2="588" y2="190"/><line x1="612" y1="156" x2="612" y2="250"/>
<line x1="768" y1="156" x2="768" y2="190"/><line x1="792" y1="156" x2="792" y2="250"/>
</g>
<!-- voltage chart -->
<text x="120" y="400" font-size="20" font-weight="700" fill="#5b6b7a">Bus voltage over time</text>
<line x1="220" y1="430" x2="220" y2="690" stroke="#11202b" stroke-width="2"/>
<line x1="220" y1="690" x2="1060" y2="690" stroke="#11202b" stroke-width="2"/>
<g stroke="#d6e0ea" stroke-dasharray="4 4"><line x1="220" y1="480" x2="1060" y2="480"/><line x1="220" y1="560" x2="1060" y2="560"/><line x1="220" y1="640" x2="1060" y2="640"/></g>
<g font-size="16" fill="#5b6b7a" text-anchor="end"><text x="210" y="485">3.5V</text><text x="210" y="565">2.5V</text><text x="210" y="645">1.5V</text></g>
<rect x="500" y="450" width="260" height="250" fill="#eef3f8"/>
<!-- CAN_H trace -->
<polyline points="260,560 500,560 500,480 760,480 760,560 1000,560" fill="none" stroke="#002B5C" stroke-width="4"/>
<!-- CAN_L trace -->
<polyline points="260,560 500,560 500,640 760,640 760,560 1000,560" fill="none" stroke="#3F88C5" stroke-width="4"/>
<text x="380" y="730" text-anchor="middle" font-size="18" font-weight="700" fill="#11202b">Recessive (1)</text>
<text x="380" y="752" text-anchor="middle" font-size="15" fill="#5b6b7a">both ≈2.5V · diff 0V</text>
<text x="630" y="730" text-anchor="middle" font-size="18" font-weight="700" fill="#002B5C">Dominant (0)</text>
<text x="630" y="752" text-anchor="middle" font-size="15" fill="#5b6b7a">H=3.5V L=1.5V · diff 2V</text>
<text x="880" y="730" text-anchor="middle" font-size="18" font-weight="700" fill="#11202b">Recessive (1)</text>
</svg>
